# 模拟记忆库种子数据 (默认人格: 绫音 / 用户: 哥哥)
#
# 用法: `uv run python scripts/seed_mock_memories.py`
# 每个 [[memory]] 块对应一条 memory_entries 行, 内容形态模拟"记忆分析 Agent 已提取后"的陈述句.
#
# 字段说明:
#   content     必填. 陈述句本身. 用第三人称叙述 "哥哥 X" / "绫音 Y", 与提取产物一致.
#   type        permanent | normal. permanent 不衰减; normal 走衰减模型.
#   importance  0.0-1.0. 影响初始 priority (permanent 会被强制拉到 1.0).
#   tags        emotional_tags 列表.
#   age_days    距今天数, 用于构造 created_at 时间分布 (0=今天, 30=一个月前).
#   role        可选, 默认 "user". 支持 "user" / "assistant" / "system".
#               "user"      = 记忆来源于哥哥的发言
#               "assistant" = 记忆来源于绫音自己的表态/承诺
#   decay_rate  可选. 省略时按 type 推断: permanent→0.0, normal→0.3.

