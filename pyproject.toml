[project]
name = "mnemosync"
version = "0.2.8"
description = "基于 LangGraph 多 Agent 编排的跨平台人格记忆管理系统"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "HarryHelloo", email = "harryhelloo@example.com" }
]
keywords = ["llm", "agent", "langgraph", "memory", "openai", "dashscope"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # HTTP 客户端（Forwarder + DashScope API）
    "httpx>=0.27.0",
    # 数据校验与配置
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    # Agent 编排（v0.2 核心）
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    # 向量存储
    "chromadb>=0.5.0",
    # 关系型存储
    "aiosqlite>=0.20.0",
    # 加密（LLM 服务商 API Key 存储）
    "cryptography>=42.0.0",
    # 日志
    "structlog>=24.4.0",
    # 认证
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>8.3.0",
    "pytest-asyncio>0.24.0",
    "pytest-cov>5.0.0",
    "ruff>0.7.0",
    "mypy>1.12.0",
    "pre-commit>4.0.0",
]

[project.scripts]
mnemosync = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
