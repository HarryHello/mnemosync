[project]
name = "mnemosync"
version = "0.4.0"
description = "基于 LangGraph 多 Agent 编排的跨平台人格记忆管理系统"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "HarryHelloo", email = "harryhelloo@example.com" }
]
keywords = ["llm", "agent", "langgraph", "memory", "openai", "dashscope"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web 框架
    "fastapi~=0.141",
    "uvicorn[standard]~=0.52",
    # HTTP 客户端（Forwarder + DashScope API）
    "httpx[socks]~=0.28",
    # LLM SDK（上游转发）
    "openai>=2.50.0",
    "anthropic>=0.110.0",
    # 数据校验与配置
    "pydantic~=2.13",
    "pydantic-settings~=2.14",
    "python-dotenv~=1.2",
    # Agent 编排（v0.3.5: 升级到 1.x, 移除未使用的 langchain/langchain-openai）
    "langgraph~=1.2",
    "langchain-core~=1.5",
    # 向量存储
    "chromadb~=1.5",
    # 关系型存储
    "aiosqlite~=0.22",
    # 加密（LLM 服务商 API Key 存储）
    "cryptography~=50.0",
    # 日志
    "structlog~=26.1",
    # 认证（密码哈希）
    "bcrypt~=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "ruff~=0.16",
    "mypy~=2.3",
    "pre-commit~=4.6",
]

[project.scripts]
mnemosync = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008", "B904", "B017", "E741"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[dependency-groups]
dev = [
    "mypy~=2.3",
    "pre-commit~=4.6",
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "ruff~=0.16",
]
