name: Preview Build

# 触发条件: 推送 beta 分支 (预发布测试)
# 产物: GitHub pre-release tag=preview + ui-dist.tar.gz (预编译前端静态资源)
# 用途: 服务器上 `curl .../beta/install.sh | sh`
#      拉取 beta 分支代码 + 对应预编译 UI, 无需在服务器编译前端。
# 注: tag 用 preview 而非 beta, 避免与 beta 分支同名导致 git push 歧义。

on:
  push:
    branches:
      - 'beta'

permissions:
  contents: write   # 创建 pre-release 需要

jobs:
  build-ui:
    name: Build UI and publish pre-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Verify build output
        run: |
          test -f ui/dist/index.html || (echo "❌ ui/dist/index.html not found"; exit 1)
          test -d ui/dist/assets       || (echo "❌ ui/dist/assets not found"; exit 1)
          echo "✅ UI build ok, size:"
          du -sh ui/dist

      - name: Package ui-dist tarball
        run: |
          tar -czf ui-dist.tar.gz -C ui dist
          ls -lh ui-dist.tar.gz

      - name: Delete old preview pre-release (if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 固定 tag=preview, 每次迭代覆盖更新
          gh release delete preview --yes 2>/dev/null || true
          git push origin --delete refs/tags/preview 2>/dev/null || true

      - name: Create preview pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create preview \
            --title "Mnemosync beta (preview)" \
            --prerelease \
            --notes "预发布测试构建，自动更新。服务器: \`curl -fsSL https://raw.githubusercontent.com/HarryHello/mnemosync/beta/install.sh | sh\`" \
            --target "${GITHUB_SHA}" \
            ui-dist.tar.gz