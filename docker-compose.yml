services:
  mnemosync:
    build: .
    ports:
      - "16125:16125"
    volumes:
      - ./data:/app/data
      - ./config.local.toml:/app/config.local.toml:ro
    environment:
      - PORT=16125
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:16125/health', timeout=5).getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
