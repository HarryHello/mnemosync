services:
  mnemosync:
    build: .
    ports:
      - "16125:16125"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=16125
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16125/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
